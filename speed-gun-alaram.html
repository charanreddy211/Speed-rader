<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Gun Radar Debug</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 400px; border-radius: 15px; margin-bottom: 10px; border: 2px solid #dee2e6; width: 100%; }
        .alert-active { background-color: #ff0000 !important; color: white; animation: pulse-red 1s infinite; }
        @keyframes pulse-red { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
        .map-overlay-btn { position: absolute; z-index: 1000; top: 10px; right: 10px; }
        #debugLog { background: #000; color: #0f0; font-family: monospace; font-size: 12px; height: 80px; overflow-y: scroll; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body class="bg-light">

<div class="container mt-3">
    <div class="card shadow">
        <div class="card-header bg-dark text-white text-center">Speed Gun Radar</div>
        <div class="card-body">
            <div class="position-relative">
                <button id="locateBtn" class="btn btn-primary btn-sm shadow map-overlay-btn">📍 Find Me</button>
                <div id="map"></div>
            </div>

            <div id="statusPanel" class="p-3 mb-3 border rounded text-center">
                <div class="row">
                    <div class="col-6 border-end">
                        <small class="text-muted d-block">Distance</small>
                        <span id="distDisplay" class="h4">0.00</span> km
                    </div>
                    <div class="col-6">
                        <small class="text-muted d-block">Status</small>
                        <span id="statusText" class="h4">Idle</span>
                    </div>
                </div>
            </div>

            <div class="d-grid gap-2 mb-3">
                <button id="startBtn" class="btn btn-success btn-lg">Start Radar</button>
            </div>

            <h6>System Debug Log:</h6>
            <div id="debugLog">App initialized...</div>
        </div>
    </div>
</div>

<audio id="alarmSound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" loop></audio>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    let map, userMarker, targetMarker, rangeCircle, watchId = null, targetCoords = null;
    const alarm = document.getElementById('alarmSound');
    const logger = document.getElementById('debugLog');

    function log(msg) { logger.innerHTML += "<br>> " + msg; logger.scrollTop = logger.scrollHeight; }

    // Initialize Map
    map = L.map('map').setView([20, 78], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    function centerOnUser() {
        log("Requesting GPS location...");
        navigator.geolocation.getCurrentPosition(pos => {
            const { latitude, longitude } = pos.coords;
            log(`Success: ${latitude.toFixed(4)}, ${longitude.toFixed(4)}`);
            map.flyTo([latitude, longitude], 16);
            if (!userMarker) userMarker = L.marker([latitude, longitude]).addTo(map).bindPopup("You");
            else userMarker.setLatLng([latitude, longitude]);
        }, err => {
            log(`ERROR: ${err.message} (Code: ${err.code})`);
            if(err.code === 1) log("PERMISSION DENIED. Use HTTPS or check Chrome settings.");
        }, { enableHighAccuracy: true });
    }

    map.on('click', e => {
        if (targetMarker) map.removeLayer(targetMarker);
        if (rangeCircle) map.removeLayer(rangeCircle);
        targetCoords = e.latlng;
        targetMarker = L.marker(targetCoords, {icon: L.icon({iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png', iconSize: [25, 41]})}).addTo(map);
        rangeCircle = L.circle(targetCoords, { color: 'red', radius: 1000 }).addTo(map);
        log("Target Set.");
    });

    function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    document.getElementById('startBtn').addEventListener('click', function() {
        if (watchId === null) {
            log("Radar Starting...");
            watchId = navigator.geolocation.watchPosition(p => {
                const d = getDistance(p.coords.latitude, p.coords.longitude, targetCoords?.lat || 0, targetCoords?.lng || 0);
                document.getElementById('distDisplay').innerText = d.toFixed(2);
                if (targetCoords && d <= 1.0) {
                    document.getElementById('statusPanel').classList.add('alert-active');
                    document.getElementById('statusText').innerText = "ALARM!";
                    alarm.play().catch(() => log("Sound Blocked - Interact with map first"));
                } else {
                    document.getElementById('statusPanel').classList.remove('alert-active');
                    document.getElementById('statusText').innerText = "Tracking";
                    alarm.pause();
                }
            }, e => log("GPS Error: " + e.message), { enableHighAccuracy: true });
            this.innerText = "Stop Radar";
            this.classList.replace('btn-success', 'btn-danger');
        } else {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
            log("Radar Stopped.");
            this.innerText = "Start Radar";
            this.classList.replace('btn-danger', 'btn-success');
        }
    });

    document.getElementById('locateBtn').addEventListener('click', centerOnUser);
    window.onload = centerOnUser;
</script>
</body>
</html>
