   <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Target Speed Radar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { background-color: #f8f9fa; }
        #map { height: 400px; border-radius: 15px; border: 2px solid #dee2e6; }
        .alert-active { background-color: #ff0000 !important; color: white !important; animation: pulse 0.8s infinite; }
        @keyframes pulse { 50% { opacity: 0.7; } }
        #muteBtn { display: none; margin-bottom: 10px; }
        .badge-count { font-size: 0.9rem; vertical-align: middle; }
    </style>
</head>
<body>

<div class="container py-3">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
            <span>🚀 MULTI-RADAR</span>
            <span class="badge bg-primary badge-count"><span id="gunCount">0</span> Targets Set</span>
        </div>
        <div class="card-body">
            
            <div class="position-relative mb-3">
                <div id="map"></div>
            </div>

            <div id="statusPanel" class="p-3 border rounded text-center bg-white mb-3">
                <div class="row">
                    <div class="col-6 border-end">
                        <small class="text-muted d-block">CLOSEST GUN</small>
                        <span id="distDisplay" class="h3 fw-bold">--</span> <small>km</small>
                    </div>
                    <div class="col-6">
                        <small class="text-muted d-block">STATUS</small>
                        <span id="statusText" class="h4 fw-bold">READY</span>
                    </div>
                </div>
            </div>

            <div class="d-grid gap-2">
                <button id="muteBtn" class="btn btn-warning btn-lg fw-bold">🔕 STOP ALARM</button>
                <button id="startBtn" class="btn btn-success btn-lg shadow">START TRACKING</button>
                <button id="clearAllBtn" class="btn btn-outline-danger btn-sm">CLEAR ALL LOCATIONS</button>
            </div>
            <p class="text-center mt-2 text-muted small">Tap map to add guns. Tap a marker to remove it.</p>
        </div>
    </div>
</div>

<audio id="alarmSound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" loop></audio>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    let map, userMarker, watchId = null;
    let speedGuns = []; // Array to hold multiple markers and circles
    let isMuted = false;
    const alarm = document.getElementById('alarmSound');
    const muteBtn = document.getElementById('muteBtn');

    // Init Map
    map = L.map('map').setView([20, 78], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    // Auto-locate user
    navigator.geolocation.getCurrentPosition(pos => {
        const { latitude, longitude } = pos.coords;
        map.setView([latitude, longitude], 15);
        userMarker = L.circleMarker([latitude, longitude], {color: 'blue', radius: 7}).addTo(map);
    });

    // ADD MULTIPLE TARGETS
    map.on('click', e => {
        addSpeedGun(e.latlng);
    });

    function addSpeedGun(latlng) {
        const marker = L.marker(latlng).addTo(map);
        const circle = L.circle(latlng, { color: 'red', radius: 1000, fillOpacity: 0.1 }).addTo(map);
        
        const gunObject = { latlng, marker, circle };
        speedGuns.push(gunObject);

        // REMOVE INDIVIDUAL: Click the marker to "uncheck" it
        marker.on('click', (event) => {
            L.DomEvent.stopPropagation(event); // Prevent map click trigger
            map.removeLayer(marker);
            map.removeLayer(circle);
            speedGuns = speedGuns.filter(g => g !== gunObject);
            updateUI();
        });

        updateUI();
    }

    function updateUI() {
        document.getElementById('gunCount').innerText = speedGuns.length;
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function monitor(position) {
        const { latitude, longitude } = position.coords;
        if (userMarker) userMarker.setLatLng([latitude, longitude]);

        let closestDist = Infinity;
        let inDangerZone = false;

        // Loop through ALL speed guns
        speedGuns.forEach(gun => {
            const d = calculateDistance(latitude, longitude, gun.latlng.lat, gun.latlng.lng);
            if (d < closestDist) closestDist = d;
            if (d <= 1.0) inDangerZone = true;
        });

        if (speedGuns.length > 0) {
            document.getElementById('distDisplay').innerText = closestDist.toFixed(2);
        }

        if (inDangerZone) {
            if (!isMuted) {
                alarm.play().catch(() => {});
                muteBtn.style.display = "block";
            }
            document.getElementById('statusPanel').classList.add('alert-active');
            document.getElementById('statusText').innerText = "NEAR GUN!";
        } else {
            resetAlarmUI();
            isMuted = false; 
        }
    }

    function resetAlarmUI() {
        alarm.pause();
        muteBtn.style.display = "none";
        document.getElementById('statusPanel').classList.remove('alert-active');
        document.getElementById('statusText').innerText = speedGuns.length > 0 ? "TRACKING" : "READY";
    }

    muteBtn.addEventListener('click', () => {
        isMuted = true;
        alarm.pause();
        muteBtn.style.display = "none";
    });

    document.getElementById('startBtn').addEventListener('click', function() {
        if (watchId === null) {
            alarm.play().then(() => alarm.pause()); 
            watchId = navigator.geolocation.watchPosition(monitor, null, { enableHighAccuracy: true });
            this.innerText = "STOP RADAR";
            this.classList.replace('btn-success', 'btn-danger');
        } else {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
            resetAlarmUI();
            this.innerText = "START TRACKING";
            this.classList.replace('btn-danger', 'btn-success');
        }
    });

    document.getElementById('clearAllBtn').addEventListener('click', () => {
        speedGuns.forEach(gun => {
            map.removeLayer(gun.marker);
            map.removeLayer(gun.circle);
        });
        speedGuns = [];
        document.getElementById('distDisplay').innerText = "--";
        updateUI();
        resetAlarmUI();
    });
</script>
</body>
</html>
                                                                                                                                                                                                                                                                    <audio id="alarmSound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" loop></audio>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function centerOnUser() {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        navigator.geolocation.getCurrentPosition(pos => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const { latitude, longitude } = pos.coords;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    log(`Success: ${latitude.toFixed(4)}, ${longitude.toFixed(4)}`);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                map.flyTo([latitude, longitude], 16);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (!userMarker) userMarker = L.marker([latitude, longitude]).addTo(map).bindPopup("You");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        else userMarker.setLatLng([latitude, longitude]);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    rangeCircle = L.circle(targetCoords, { color: 'red', radius: 1000 }).addTo(map);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            log("Target Set.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            function getDistance(lat1, lon1, lat2, lon2) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const R = 6371;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const dLat = (lat2 - lat1) * Math.PI / 180;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const dLon = (lon2 - lon1) * Math.PI / 180;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById('startBtn').addEventListener('click', function() {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            log("Radar Starting...");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }, e => log("GPS Error: " + e.message), { enableHighAccuracy: true });
